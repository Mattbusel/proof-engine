[package]
name = "proof-engine"
version = "0.3.0"
edition = "2021"
authors = ["Matthew Busel <matt@tensorust.com>"]
license = "MIT"
description = "Real-time graphics from math: glyphs and particles moved by ODEs, strange attractors and force fields, drawn with HDR bloom on OpenGL."
repository = "https://gitlab.com/mattbusel/proof-engine"
homepage = "https://proof-engine-rs.vercel.app/"
documentation = "https://docs.rs/proof-engine"
keywords = ["generative-art", "creative-coding", "attractor", "game-engine", "opengl"]
categories = ["game-engines", "graphics", "rendering", "simulation", "mathematics"]
readme = "README.md"
# Screenshots, GIFs and repo tooling stay on GitHub; the README links resolve there.
exclude = ["*.png", "*.gif", "*.jpg", "assets/", "docs/", "*.py", ".github/", "ci/"]

[dependencies]
# OpenGL and windowing: glutin-winit bridges the two and handles version alignment
glutin     = "0.32"
glutin-winit = "0.5"
glow       = "0.16"
winit      = "0.30"
raw-window-handle = "0.6"

# Math
glam  = "0.25"

# Colour gradients and scientific palettes (viridis, magma, turbo, CSS strings)
colorgrad = { version = "0.9", default-features = false, features = ["std", "preset", "named-colors"] }

# Scripting: dynamical systems written in Rhai and hot reloaded (math::scripted)
rhai = { version = "1.26", optional = true }

# Font rasterization (pure Rust, no system deps)
ab_glyph = "0.2"

# Audio: cpal for the device, hound for reading and writing WAV files
cpal  = "0.15"
hound = "3.5"

# Image encoding and decoding: frame capture (PNG, JPEG, animated GIF) and
# image assets
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "tga"] }

# Bytemuck for safe GPU buffer casting (glyph instances)
bytemuck = { version = "1", features = ["derive"] }

# Serialization (config)
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml  = "0.8"

# Logging
log        = "0.4"
env_logger = "0.11"

# Bitflags (used by scene_io SceneFlags)
bitflags = "2"

[features]
default = ["rhai-scripts"]
# math::scripted: dynamical systems written in Rhai, hot reloaded from disk.
# Rhai adds `Add` impls for String, so in a crate that also links it,
# `String + &String` needs an explicit `.as_str()`. Turn this feature off
# (default-features = false) if that bites.
rhai-scripts = ["dep:rhai"]

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "particle_bench"
harness = false

[[bench]]
name = "glyph_bench"
harness = false

[[example]]
