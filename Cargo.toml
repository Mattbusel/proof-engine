[[example]]
name = "chaos_field"

[[example]]
name = "particle_demo"

[[example]]
name = "force_fields"

[[example]]
name = "amorphous_entity"

[[example]]
name = "strange_attractors"

[[example]]
name = "full_combat"

[[example]]
name = "galaxy"

[[example]]
name = "heartbeat"

[[example]]
