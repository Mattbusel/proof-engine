name: Bug report
description: Something renders wrong, crashes, or does not build
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you expected, and what you saw instead. A screenshot helps for anything visual.
    validations:
      required: true
  - type: input
    id: command
    attributes:
      label: Command
      placeholder: cargo run --release --example convergence
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: OS and GPU
      placeholder: Windows 11, RTX 3070 / macOS 14, M2 / Ubuntu 24.04, Intel UHD
    validations:
      required: true
  - type: input
    id: rust
    attributes:
      label: rustc --version
  - type: textarea
    id: log
    attributes:
      label: Log output
      description: Run with RUST_LOG=info and paste the output around the problem.
      render: text
